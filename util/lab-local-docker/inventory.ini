# Inventory for the local Docker lab (util/lab-local-docker)
# All three "servers" are containers on your own machine, reached through mapped SSH ports.

[webservers]
ansible-lab-server-1 ansible_host=127.0.0.1 ansible_port=2221
ansible-lab-server-2 ansible_host=127.0.0.1 ansible_port=2222

[dbservers]
ansible-lab-server-3 ansible_host=127.0.0.1 ansible_port=2223

[production:children]
webservers
dbservers

[ansible_lab_servers:children]
webservers
dbservers

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/ansible-lab
ansible_python_interpreter=/usr/bin/python3
