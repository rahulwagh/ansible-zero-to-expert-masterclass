---
# ==============================================
# 02 - ansible-vault encrypt_string
# ==============================================
# Encrypts a single string value inline — no separate vars file needed.
# The encrypted value is embedded directly in the playbook or vars file.
#
# Generate an encrypted string:
#   ansible-vault encrypt_string 'SuperSecret123!' --name 'db_password'
#
# Output looks like:
#   db_password: !vault |
#             $ANSIBLE_VAULT;1.1;AES256
#             66386439653236336462626566653337...
#
# Copy that block directly into your vars: section.
#
# Run:
#   ansible-playbook 02-encrypt-string.yml --ask-vault-pass
# ==============================================

# ----------------------------------------------
# Example 1: Inline encrypted string in vars
#   Replace the !vault block below with your own encrypt_string output.
#   ansible-vault encrypt_string 'SuperSecret123!' --name 'db_password'
# ----------------------------------------------
- name: "Example 1: Inline encrypt_string value"
  hosts: webservers
  become: true

  vars:
    app_name: "myapp"
    # Generated with: ansible-vault encrypt_string 'SuperSecret123!' --name 'db_password'
    # Replace this block with your own encrypt_string output
    db_password: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      38333363646366613635616666333665393636643166343361356139383033373737616639373636
      6137646533633734636130656338656661336330323634310a373236636561323339393762363261
      31356666636462316132613032376139626537363134646564663336393730333662626665326433
      6430396635303535340a633437666565636665613337356634663833316234323130343461303035
      6163

  tasks:
    - name: Show db_password is available (length only — never log secrets)
      ansible.builtin.debug:
        msg: "db_password is set and has {{ db_password | length }} characters"

    - name: Write config using inline vault string
      ansible.builtin.copy:
        dest: /tmp/app-inline.env
        content: "DB_PASSWORD={{ db_password }}\n"
        mode: "0600"
