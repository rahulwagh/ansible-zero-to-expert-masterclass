---
# ==============================================
# 03 - Vault Password File
# ==============================================
# Instead of typing the vault password on every run, store it in a file.
#
# Setup:
#   echo "MyVaultPassword123" > ~/.vault_pass
#   chmod 600 ~/.vault_pass
#
# Option A — pass on the command line:
#   ansible-playbook 03-vault-password-file.yml --vault-password-file ~/.vault_pass
#
# Option B — set it in ansible.cfg (uncomment the line):
#   [defaults]
#   vault_password_file = ~/.vault_pass
#
#   Then just run:
#   ansible-playbook 03-vault-password-file.yml
#
# IMPORTANT: Never commit the vault password file to version control.
#   Add it to .gitignore:
#   echo ".vault_pass" >> ~/.gitignore
#   echo "*.vault_pass" >> .gitignore
# ==============================================

# ----------------------------------------------
# Example 1: Re-encrypt the secrets file with the password file
#   This shows that --vault-password-file works the same as --ask-vault-pass
#   ansible-vault encrypt vars/secret_vars.yml --vault-password-file ~/.vault_pass
# ----------------------------------------------
- name: "Example 1: Use vault password file"
  hosts: webservers
  become: true

  vars_files:
    - vars/secret_vars.yml   # vault-encrypted

  tasks:
    - name: Confirm vault decryption worked via password file
      ansible.builtin.debug:
        msg: "Vault decrypted OK — api_key length: {{ api_key | length }} chars"

    - name: Deploy app config with secrets
      ansible.builtin.copy:
        dest: /tmp/vault-test.env
        content: |
          DB_PASSWORD={{ db_password }}
          API_KEY={{ api_key }}
        mode: "0600"

# ----------------------------------------------
# Example 2: Multiple vault password IDs
#   Use different passwords for different secret categories.
#   Useful in large teams: devs use 'dev' vault, ops use 'prod' vault.
#
#   Create two password files:
#     echo "DevPassword123"  > ~/.vault_pass_dev
#     echo "ProdPassword456" > ~/.vault_pass_prod
#     chmod 600 ~/.vault_pass_dev ~/.vault_pass_prod
#
#   Encrypt with a vault ID label:
#     ansible-vault encrypt vars/secret_vars.yml \
#       --vault-id dev@~/.vault_pass_dev
#
#   Run with multiple vault IDs:
#     ansible-playbook 03-vault-password-file.yml \
#       --vault-id dev@~/.vault_pass_dev \
#       --vault-id prod@~/.vault_pass_prod
# ----------------------------------------------
- name: "Example 2: Vault ID awareness"
  hosts: webservers
  become: true

  tasks:
    - name: Show vault ID concept
      ansible.builtin.debug:
        msg: >
          Vault IDs let you use different passwords per secret group.
          Use --vault-id dev@~/.vault_pass_dev for dev secrets,
          --vault-id prod@~/.vault_pass_prod for prod secrets.
