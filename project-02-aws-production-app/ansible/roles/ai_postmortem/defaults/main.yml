---
ai_model: claude-sonnet-5-5
ai_url: https://api.anthropic.com/v1/messages
ai_max_tokens: 1000
ai_effort: low   # short, direct answer; the model's thinking tokens count against max_tokens
# Read from your shell. It is used on your laptop only and is never copied to a server.
anthropic_api_key: "{{ lookup('ansible.builtin.env', 'ANTHROPIC_API_KEY') }}"
