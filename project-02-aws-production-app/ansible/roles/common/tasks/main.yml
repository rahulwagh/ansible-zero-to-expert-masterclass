---
- name: Update apt cache
  tags: [common_apt]
  ansible.builtin.apt:
    lock_timeout: 600
    update_cache: true

- name: Base packages (postgresql-client lets you test the RDS connection by hand)
  ansible.builtin.apt:
    lock_timeout: 600
    name:
      - python3
      - python3-apt
      - curl
      - ca-certificates
      - postgresql-client
    state: present
  tags: [common_packages]
