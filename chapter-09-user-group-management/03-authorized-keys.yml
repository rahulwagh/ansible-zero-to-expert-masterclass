# ==============================================
# 03 - Authorized Keys Management
# ==============================================
# Run: ansible-playbook 03-authorized-keys.yml
#
# The `authorized_key` module manages SSH public keys
# in a user's ~/.ssh/authorized_keys file.
# It is idempotent — adding the same key twice is safe.

