#      debug:
#        var: auth_keys_content.stdout

# ----------------------------------------------
# Example 2: Remove a specific SSH key
# ----------------------------------------------
- name: "Example 2: Remove an SSH key"
  hosts: webservers
  become: true

  vars:
    key_to_remove: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQDemoKeyForAnsibleCourse devops@control-node"

  tasks:
    - name: Remove specific SSH key from 'deploy' user
      authorized_key:
        user: deploy
        key: "{{ key_to_remove }}"
        state: absent

    - name: Show remaining keys
      command: cat /home/deploy/.ssh/authorized_keys
      register: remaining_keys
      changed_when: false

    - name: Display remaining keys
      debug:
        var: remaining_keys.stdout_lines
