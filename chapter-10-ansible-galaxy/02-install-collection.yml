# ----------------------------------------------
# Example 4: Use FQCN for built-in modules (best practice)
#   ansible.builtin.* is the FQCN for Ansible core modules
#   Always use FQCN inside collections to avoid ambiguity
# ----------------------------------------------
- name: "Example 4: FQCN for built-in modules"
  hosts: webservers
  become: true

  tasks:
    - name: Install curl using FQCN
      ansible.builtin.package:
        name: curl
        state: present

    - name: Ensure /opt/app directory exists
      ansible.builtin.file:
        path: /opt/app
        state: directory
        mode: "0755"

    - name: Print collection usage note
      ansible.builtin.debug:
        msg: >
          Using Fully Qualified Collection Names (FQCN) like
          'ansible.builtin.package' prevents module name conflicts
          when multiple collections are installed.
