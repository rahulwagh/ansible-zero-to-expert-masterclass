---
 ==============================================
 01 - Handler Basics
 ==============================================
 Run: ansible-playbook 01-handler-basics.yml

- name: "Example 1: Config file change triggers service restart"
  hosts: all
  gather_facts: false

  vars:
    app_port: 8080
    app_name: "myapp"

  tasks:
    # Create application config file
    - name: Create application config
      copy:
        dest: /tmp/{{ app_name }}.conf
        content: |
          # Application Configuration
          APP_NAME={{ app_name }}
          APP_PORT={{ app_port }}
          ENVIRONMENT=production
          DEBUG=false
      notify: Restart application

    # This task runs BEFORE handler (handlers run at end)
    - name: Verify config was created
      command: cat /tmp/{{ app_name }}.conf
      register: config_content
      changed_when: false

    - name: Show config content
      debug:
        msg: "{{ config_content.stdout_lines }}"

  handlers:
    - name: Restart application
      command: echo "Service {{ app_name }} restarted at $(date)"
      register: restart_output

    - name: Show restart confirmation
      debug:
        msg: "{{ restart_output.stdout }}"


- name: "Example 2: Handler only runs when task changes"
  hosts: all
  gather_facts: false

  # Run this playbook TWICE to see the difference:
  #   1st run: File created = changed = handler RUNS
  #   2nd run: File exists  = ok      = handler SKIPPED

  tasks:
    # Using 'copy' - only reports changed when content differs
    - name: Create marker file (only triggers handler on first run)
      copy:
        dest: /tmp/handler_demo_marker_file
        content: "This file was created by Ansible handler demo"
      notify: Show handler triggered message

    - name: Check if marker exists
      stat:
        path: /tmp/handler_demo_marker_file
      register: marker_stat

    - name: Show marker status
      debug:
        msg: "Marker file exists: {{ marker_stat.stat.exists }}, size: {{ marker_stat.stat.size }} bytes"

  handlers:
    - name: Show handler triggered message
      debug:
        msg: |
          ============================================
          HANDLER TRIGGERED! This only runs when the
          task reports 'changed'. Run the playbook
          again - this message will NOT appear!
          ============================================