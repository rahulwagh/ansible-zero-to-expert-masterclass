---
# ==============================================
# 01 - Handler Basics
# ==============================================
# Run: ansible-playbook 01-handler-basics.yml

- name: Understanding handlers
  hosts: all
  gather_facts: false

  vars:
    config_changed: true

  tasks:
    # Basic handler - triggered by notify
    - name: Update application config
      debug:
        msg: "Updating application configuration..."
      notify: Restart application
      changed_when: config_changed

    - name: Show task order
      debug:
        msg: "This runs BEFORE the handler (handlers run at end)"

  handlers:
    - name: Restart application
      debug:
        msg: "Handler: Restarting application service..."


- name: Handler only runs when task changes
  hosts: all
  gather_facts: false

  tasks:
    # This task reports "ok" (not changed) - handler NOT triggered
    - name: Check config (no change)
      debug:
        msg: "Checking config - no changes needed"
      notify: Restart service
      # changed_when defaults to false for debug module

    - name: Show handler status
      debug:
        msg: "Handler was NOT triggered because task didn't change anything"

  handlers:
    - name: Restart service
      debug:
        msg: "This will NOT run - task didn't report changed"


- name: Handler runs only once
  hosts: all
  gather_facts: false

  tasks:
    # Multiple tasks notify the SAME handler
    - name: Update config file 1
      debug:
        msg: "Updating config file 1..."
      notify: Restart nginx
      changed_when: true

    - name: Update config file 2
      debug:
        msg: "Updating config file 2..."
      notify: Restart nginx
      changed_when: true

    - name: Update config file 3
      debug:
        msg: "Updating config file 3..."
      notify: Restart nginx
      changed_when: true

    - name: Note about handler
      debug:
        msg: "3 tasks notified, but handler runs only ONCE!"

  handlers:
    # Handler runs only ONCE even if notified multiple times
    - name: Restart nginx
      debug:
        msg: "Handler: Nginx restarted (runs only once!)"
