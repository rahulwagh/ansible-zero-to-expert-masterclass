---
# ==============================================
# 04 - Flush Handlers
# ==============================================
# Run: ansible-playbook 04-flush-handlers.yml

- name: Flush handlers - practical example
  hosts: all
  gather_facts: false

  tasks:
    - name: Install nginx package
      debug:
        msg: "Installing nginx..."
      notify: Start nginx
      changed_when: true

    - name: Configure nginx
      debug:
        msg: "Configuring nginx..."
      notify: Reload nginx
      changed_when: true

    # Flush to ensure nginx is running before health check
    - name: Ensure nginx is running before checks
      meta: flush_handlers

    - name: Health check - verify nginx responds
      debug:
        msg: "Checking http://localhost:80 ... OK!"

    - name: Register with load balancer
      debug:
        msg: "Registering server with load balancer..."

  handlers:
    - name: Start nginx
      debug:
        msg: "Handler: Starting nginx service..."

    - name: Reload nginx
      debug:
        msg: "Handler: Reloading nginx..."
