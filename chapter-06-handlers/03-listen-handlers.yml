---
# ==============================================
# 03 - Listen Handlers
# ==============================================
# Run: ansible-playbook 03-listen-handlers.yml

- name: Listen directive - group handlers
  hosts: all
  gather_facts: false

  tasks:
    # One notify triggers MULTIPLE handlers using listen
    - name: Deploy web application
      copy:
        dest: /tmp/handler_demo_marker_file_1
        content: "This file was created by Ansible handler demo"
      notify: restart web stack
      changed_when: true

  handlers:
    # Multiple handlers listen to the same event
    - name: Restart nginx
      debug:
        msg: "Handler: Restarting nginx..."
      listen: restart web stack

    - name: Restart php-fpm
      debug:
        msg: "Handler: Restarting php-fpm..."
      listen: restart web stack

    - name: Clear opcache
      debug:
        msg: "Handler: Clearing PHP opcache..."
      listen: restart web stack