- name: Handler execution order
  hosts: all
  gather_facts: false

  tasks:
    - name: Task 1 - notifies handler B
      debug:
        msg: "Task 1 notifying handler B"
      notify: Handler B
      changed_when: true

    - name: Task 2 - notifies handler A
      debug:
        msg: "Task 2 notifying handler A"
      notify: Handler A
      changed_when: true

    - name: Note about order
      debug:
        msg: "Even though B was notified first, A runs first (definition order)"

  handlers:
    # A is defined first, so it runs first
    - name: Handler A
      debug:
        msg: "Handler A runs FIRST (defined first)"

    - name: Handler B
      debug:
        msg: "Handler B runs SECOND (defined second)"


- name: Handler calling another handler
  hosts: all
  gather_facts: false

  tasks:
    - name: Update SSL certificate
      debug:
        msg: "Updating SSL certificate..."
      notify: Reload nginx config
      changed_when: true

  handlers:
    - name: Reload nginx config
      debug:
        msg: "Handler: Reloading nginx configuration..."
      notify: Verify nginx status

    - name: Verify nginx status
      debug:
        msg: "Handler: Verifying nginx is running correctly..."
