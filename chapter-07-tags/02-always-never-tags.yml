---
# ==============================================
# 02 - Special Tags: always and never
# ==============================================
# Run: ansible-playbook 02-always-never-tags.yml --tags "deploy"
#
# 'always' - Runs EVERY time (unless explicitly skipped with --skip-tags "always")
# 'never'  - NEVER runs (unless explicitly included with --tags "never_tag_name")

- name: "Example 1: always tag - tasks that must always run"
  hosts: webservers
  become: true
  gather_facts: false

  vars:
    app_name: "myapp"
    deploy_dir: "/opt/{{ app_name }}"

  tasks:
    # This runs no matter which tags you pass on CLI
    - name: Ensure deploy directory exists
      file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      tags: always

    # This also always runs - good for post-deploy verification
    - name: Check application health
      uri:
        url: "http://localhost:80"
        status_code: 200
      register: health_check
      ignore_errors: true
      tags: health
