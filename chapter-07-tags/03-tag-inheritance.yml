---
# ==============================================
# 03 - Tag Inheritance (play, role, block, include)
# ==============================================
# Run: ansible-playbook 03-tag-inheritance.yml --tags "setup"

- name: "Example 1: Play-level tags"
  hosts: webservers
  become: true
  gather_facts: false
  # All tasks in this play inherit the 'websetup' tag
  tags: websetup

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Install certbot
      apt:
        name: certbot
        state: present

    - name: Start nginx
      service:
        name: nginx
        state: started
