# Local Docker lab (infra/docker). private_ip = container name: every container
# resolves the others by name on the compose network, exactly like private IPs in a VPC.

[loadbalancers]
lb-1  ansible_host=127.0.0.1 ansible_port=2231 private_ip=lb-1

[appservers]
app-1 ansible_host=127.0.0.1 ansible_port=2232 private_ip=app-1
app-2 ansible_host=127.0.0.1 ansible_port=2233 private_ip=app-2

[dbservers]
db-1  ansible_host=127.0.0.1 ansible_port=2234 private_ip=db-1

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=../infra/keys/lab
ansible_python_interpreter=/usr/bin/python3
